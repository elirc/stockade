name: Stockade checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockade
          POSTGRES_USER: stockade
          POSTGRES_PASSWORD: stockade_local_only
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U stockade -d stockade"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: dotnet test tests/Fulfil.Tests/Fulfil.Tests.csproj
      - run: npm run build
      - name: API and database acceptance
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project services/Fulfil --no-build --no-launch-profile > /tmp/stockade-api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5080/health && break || sleep 2; done
          node scripts/integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification, path: artifacts/}
